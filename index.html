<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World App</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .container {
            text-align: center;
        }
        #helloText {
            font-size: 2rem;
            color: #333;
        }
        #colorButton {
            padding: 10px 20px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s ease;
        }
        #colorButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="helloText">Hello World</div>
        <button id="colorButton" onclick="changeColor()">Change Color</button>
    </div>

    <script>
        function changeColor() {
            const helloText = document.getElementById('helloText');
            const currentColor = helloText.style.color;
            helloText.style.color = currentColor === 'red' ? '#333' : 'red';
        }

        // Handle URL parameters
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const urlColor = urlParams.get('color');
            if (urlColor) {
                document.getElementById('helloText').style.color = urlColor;
            }
        };
    </script>
</body>
</html>

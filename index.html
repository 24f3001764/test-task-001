<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date and Time Display</title>
<style>
  body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
  }
  .container {
    text-align: center;
    padding: 20px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  }
  .time-display {
    margin-bottom: 20px;
    font-size: 24px;
  }
  .refresh-btn {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
  }
</style>
</head>
<body>
<div class="container">
  <div class="time-display" id="timeDisplay">Loading time...</div>
  <button class="refresh-btn" id="refreshTime">Refresh Time</button>
</div>
<script>
  function updateTime() {
    const now = new Date();
    document.getElementById('timeDisplay').textContent = now.toLocaleString();
  }

  document.getElementById('refreshTime').addEventListener('click', updateTime);

  // Initial time display
  updateTime();
</script>
</body>
</html>
